<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bài thực hành</title>
  <script>try{var t=localStorage.getItem('study-theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header compact">
    <div class="hbar">
      <a class="back" href="index.html">← Danh sách bài</a>
      <span class="spacer"></span>
      <a class="back" href="../index.html">🏠 Trang chủ</a>
      <button class="theme-toggle" id="themeToggle" title="Đổi giao diện Sáng/Tối">🌙</button>
    </div>
    <h1 id="lessonTitle">Đang tải…</h1>
    <p class="lesson-kicker"><span class="progress-mini" id="lessonPhase"></span></p>
    <div class="course-progress">
      <div class="bar slim"><span id="courseBarFill"></span></div>
      <span class="progress-mini" id="courseProgressText"></span>
    </div>
  </header>

  <main class="lesson-wrap" id="lessonRoot">
    <!-- 1. Đề bài -->
    <section class="section">
      <h2 class="section-head"><span class="n">1</span> Đề bài</h2>
      <div class="task" id="task"></div>
    </section>

    <!-- 2. Code -->
    <section class="section">
      <h2 class="section-head"><span class="n">2</span> Sửa code — rồi bấm ▶ Chạy &amp; Chấm</h2>
      <div id="snack"></div>
    </section>

    <!-- 3. Kết quả chấm -->
    <section class="section">
      <h2 class="section-head"><span class="n">3</span> Kết quả chấm</h2>
      <div class="checks">
        <div class="checks-status" id="checksStatus">Chưa chạy lần nào.</div>
        <div id="checkList"></div>
        <div class="lesson-actions">
          <button class="btn primary" id="btnDone" disabled>✓ Hoàn thành &amp; bài sau</button>
          <span class="done-hint" id="doneHint">Qua hết các mục kiểm tra thì nút này mở.</span>
        </div>
      </div>
    </section>

    <!-- 4. Gợi ý & đáp án -->
    <section class="section">
      <h2 class="section-head"><span class="n">4</span> Gợi ý &amp; đáp án</h2>
      <div class="checks">
        <div class="helpbox">
          <button class="btn" id="btnHint">💡 Gợi ý</button>
          <button class="btn" id="btnSolution">👁 Xem đáp án</button>
        </div>
        <div id="hintList"></div>
        <div id="solutionBox"></div>
      </div>
    </section>

    <nav class="lesson-nav">
      <span id="prevLink"></span>
      <span id="nextLink"></span>
    </nav>
  </main>

  <script src="../react-native-course/vendor/marked.min.js"></script>
  <script src="../react-native-course/vendor/babel.min.js"></script>
  <script src="../code-editor.js"></script>
  <script src="data.js"></script>
  <script src="runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
