<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài học · Spring Internals</title>
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("study-theme")||"dark");}catch(e){}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header compact">
    <div class="hbar">
      <a class="back" href="index.html">← Tất cả bài học</a>
      <span class="spacer"></span>
      <a class="back" href="../index.html">🏠 Trang chủ</a>
      <button class="theme-toggle" id="themeToggle" title="Đổi giao diện Sáng/Tối">🌙</button>
    </div>
    <h1 id="lessonTitle">Đang tải…</h1>
    <p class="lesson-kicker" id="lessonKicker"></p>
    <div class="progress-wrap lesson-prog">
      <div class="progress-bar"><div class="progress-fill" id="lessonProgFill"></div></div>
      <p class="progress-label" id="lessonProgLabel"></p>
    </div>
  </header>

  <main class="lesson-wrap" id="lesson">
    <!-- phần 1 — lý thuyết -->
    <section class="panel theory" id="theory"></section>

    <!-- phần 2 (code) + phần 3 (animation) -->
    <div class="lesson-main">
      <section class="panel code-panel">
        <h3>💻 Code demo</h3>
        <div class="code-tabs" id="codeTabs"></div>
        <div id="codeViews"></div>
      </section>

      <section class="panel stage-panel">
        <h3>🎬 Bên trong Spring — bấm từng bước</h3>
        <div class="stage-area" id="stageArea"></div>
        <div class="step-desc" id="stepDesc"></div>
        <p class="step-counter" id="stepCounter"></p>
        <div class="step-controls">
          <button class="btn" id="stepPrev">◀ Trước</button>
          <button class="btn primary" id="stepNext">Bước tiếp ▶</button>
          <button class="btn" id="stepReset">↺ Reset</button>
        </div>
      </section>
    </div>

    <!-- phần 4 — trắc nghiệm -->
    <section class="panel quiz">
      <h3>📝 Trắc nghiệm</h3>
      <p class="quiz-status" id="quizStatus"></p>
      <div id="quizList"></div>
      <div class="quiz-actions">
        <button class="btn" id="btnRetry">↺ Làm lại</button>
        <button class="btn good" id="btnDone" disabled>✓ Đánh dấu hoàn thành</button>
      </div>
      <p class="done-hint" id="doneHint"></p>
    </section>

    <nav class="lesson-nav">
      <span id="prevLink"></span>
      <span id="nextLink"></span>
    </nav>
  </main>

  <div id="toast"></div>

  <!-- dữ liệu bài học -->
  <script src="lessons/00-index.js"></script>
  <script src="lessons/01-ioc-di.js"></script>
  <script src="lessons/02-component-scan.js"></script>
  <script src="lessons/03-bean-definition.js"></script>
  <script src="lessons/04-bean-lifecycle.js"></script>
  <script src="lessons/05-di-deep.js"></script>
  <script src="lessons/06-bean-scope.js"></script>
  <script src="lessons/07-configuration-proxy.js"></script>
  <script src="lessons/08-properties.js"></script>
  <script src="lessons/09-auto-configuration.js"></script>
  <script src="lessons/10-bean-post-processor.js"></script>
  <script src="lessons/11-aop-proxy.js"></script>
  <script src="lessons/12-spring-application-run.js"></script>
  <script src="lessons/13-dispatcher-servlet.js"></script>
  <!-- engine -->
  <script src="common.js"></script>
</body>
</html>
